name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 75

    steps:
      # The tag build validates the release revision against all existing tags.
      - name: Wait for build and download oss artifacts
        run: |
          echo "Waiting for the Build run of tag $GITHUB_REF_NAME ($GITHUB_SHA)..."
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while true; do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml \
              --event push \
              --branch "$GITHUB_REF_NAME" \
              --commit "$GITHUB_SHA" \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId' \
              | head -1)
            if [ -n "$run_id" ]; then
              echo "Build run $run_id succeeded"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No successful Build run of tag $GITHUB_REF_NAME ($GITHUB_SHA) after $WAIT_MINUTES minutes. Check that pushing the tag triggered Build, that it is not queued behind another run, and that it is not failing."
              exit 1
            fi
            echo "Build not finished yet, waiting 30s..."
            sleep 30
          done

          gh run download "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name oss \
            --dir dist/oss
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_MINUTES: 60

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # A suffixed tag (v2026111801-rc1) publishes as a pre-release, which only
          # drivers on the Prerelease update channel pick up. The updater orders by
          # the numeric revision, so the final needs a higher revision than its prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/oss/c4z/*.c4z
            dist/oss/docs/*.pdf
            dist/oss/*.zip
            dist/oss/inventory.json
            dist/oss/inventory.sha256
            dist/oss/ha-suite-release.json
